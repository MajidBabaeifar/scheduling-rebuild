{{define "title"}}Sign up{{end}}
{{define "content"}}
<h1>Create your account</h1>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/signup">
  <label for="name">Name</label><input id="name" name="name" required value="{{.Form.name}}">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{.Form.email}}">
  <label for="username">Username <span class="muted">(your page: /username)</span></label>
  <input id="username" name="username" required pattern="[a-z0-9\-]{3,40}" value="{{.Form.username}}">
  <label for="password">Password <span class="muted">(10+ characters)</span></label>
  <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
  <label for="time_zone">Time zone</label>
  <select id="time_zone" name="time_zone" required>
    <option value="">Choose…</option>
    {{$tz := .Form.time_zone}}{{range .Zones}}<option {{if eq . $tz}}selected{{end}}>{{.}}</option>{{end}}
  </select>
  <label for="week_start">Week starts on</label>
  <select id="week_start" name="week_start"><option value="monday">Monday</option><option value="sunday">Sunday</option></select>
  <p><button>Sign up</button></p>
</form>
<script>
(function(){ var s=document.getElementById('time_zone'); if (s.value) return;
  var z=Intl.DateTimeFormat().resolvedOptions().timeZone; if (!z) return;
  if (![].some.call(s.options, function(o){return o.value===z})) { var o=document.createElement('option'); o.textContent=z; s.appendChild(o); }
  s.value=z; })();
</script>
{{end}}
