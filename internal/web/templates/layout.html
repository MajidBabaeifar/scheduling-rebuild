<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}Scheduling{{end}}</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
<style>
:root { --fg:#1c1c1e; --muted:#6b6b70; --line:#dcdce0; --bg:#fff; --soft:#f4f4f6; --accent:#2457d6; --bad:#b3261e; --ok:#1e7b34; }
@media (prefers-color-scheme: dark) { :root { --fg:#ececee; --muted:#a0a0a8; --line:#3a3a40; --bg:#161618; --soft:#222226; --accent:#7ea2ff; --bad:#ff8a80; --ok:#7bd88f; } }
* { box-sizing: border-box; }
body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
header { display:flex; flex-wrap:wrap; gap:.25rem 1rem; align-items:center; padding:.75rem 1rem; border-bottom:1px solid var(--line); }
header a { color:var(--fg); text-decoration:none; } header .brand { font-weight:600; margin-right:auto; }
main { max-width:52rem; margin:0 auto; padding:1rem; }
a { color:var(--accent); }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; } h2 { font-size:1.15rem; margin:1.5rem 0 .5rem; }
label { display:block; margin:.6rem 0 .2rem; font-weight:500; }
input, select, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:.45rem .6rem; width:100%; max-width:32rem; }
input[type=checkbox], input[type=radio] { width:auto; }
textarea { min-height:5rem; font-family:ui-monospace, monospace; font-size:.9rem; }
button, .button { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:.45rem .9rem; cursor:pointer; text-decoration:none; display:inline-block; }
button.secondary, .button.secondary { background:transparent; color:var(--accent); }
button.danger { background:transparent; border-color:var(--bad); color:var(--bad); }
.inline { display:inline; } .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
.muted { color:var(--muted); } .error { color:var(--bad); font-weight:500; } .ok { color:var(--ok); }
.card { border:1px solid var(--line); border-radius:8px; padding:.75rem 1rem; margin:.5rem 0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(14rem, 1fr)); gap:0 1rem; }
table.cal { border-collapse:collapse; width:100%; max-width:24rem; table-layout:fixed; }
table.cal th { font-weight:500; color:var(--muted); font-size:.8rem; }
table.cal td { text-align:center; padding:2px; }
table.cal a, table.cal span { display:block; padding:.4rem 0; border-radius:6px; text-decoration:none; }
table.cal a { background:var(--soft); font-weight:600; } table.cal a.sel { background:var(--accent); color:#fff; }
table.cal .out { visibility:hidden; } table.cal span { color:var(--muted); }
.times { display:grid; grid-template-columns:repeat(auto-fill, minmax(6rem, 1fr)); gap:.4rem; max-width:24rem; }
.times a { text-align:center; border:1px solid var(--accent); border-radius:6px; padding:.4rem; text-decoration:none; }
.badge { font-size:.8rem; padding:.05rem .45rem; border-radius:99px; background:var(--soft); }
.status-pending { color:#a15c00; } .status-cancelled, .status-rejected { color:var(--bad); } .status-accepted { color:var(--ok); }
fieldset { border:1px solid var(--line); border-radius:8px; margin:1rem 0; } legend { font-weight:600; padding:0 .3rem; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Scheduling</a>
  {{with .User}}
    <a href="/app">Bookings</a><a href="/app/schedules">Availability</a><a href="/app/time-off">Time off</a>
    <a href="/app/profile">Profile</a><a href="/app/sessions">Sessions</a><a href="/{{.Username}}">Public page</a>
    <form class="inline" method="post" action="/logout"><button class="secondary">Sign out</button></form>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
